name: Build PS4 Hybrid Browser v7.6 GPU Screencast

on:
  push:
    branches: [ hybrid-v7-6-gpu-screencast ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install host dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends clang-18 lld-18 make curl tar python3
          sudo ln -sf /usr/bin/clang-18 /usr/local/bin/clang
          sudo ln -sf /usr/bin/clang++-18 /usr/local/bin/clang++
          sudo ln -sf /usr/bin/ld.lld-18 /usr/local/bin/ld.lld

      - name: Download OpenOrbis v0.5.4
        run: |
          set -euxo pipefail
          curl -fL --retry 5 --retry-all-errors \
            https://github.com/OpenOrbis/OpenOrbis-PS4-Toolchain/releases/download/v0.5.4/toolchain-llvm-18.tar.gz \
            -o toolchain.tar.gz
          echo '3c7cd5bb593ca74fa1c13fd59f3938dc0fc07985167f7275063019e63abe4526  toolchain.tar.gz' | sha256sum -c -
          mkdir -p .openorbis
          tar xzf toolchain.tar.gz -C .openorbis
          LINK_X=$(find "$GITHUB_WORKSPACE/.openorbis" -type f -name link.x -print -quit)
          test -n "$LINK_X"
          echo "OO_PS4_TOOLCHAIN=$(dirname "$LINK_X")" >> "$GITHUB_ENV"

      - name: Fetch ezRemote v2.06 daemon donor
        run: |
          set -euxo pipefail
          curl -fL --retry 5 --retry-all-errors \
            https://github.com/cy33hc/ps4-ezremote-client/releases/download/2.06/ezremote_client.pkg \
            -o ezremote_client.pkg
          echo 'e09a84d193fdefd4e23378b089a0bbe76a51042bf2bd6f8d417716d6262f42f8  ezremote_client.pkg' | sha256sum -c -

      - name: Extract background daemon
        run: |
          set -euxo pipefail
          rm -rf ezremote_extract daemon
          mkdir -p ezremote_extract
          docker run --rm --user 0:0 \
            --volume "$GITHUB_WORKSPACE:/work" \
            --volume "$OO_PS4_TOOLCHAIN:/opt/openorbis" \
            --workdir /work ubuntu:20.04 bash -lc '
              export DEBIAN_FRONTEND=noninteractive
              apt-get update -qq
              apt-get install -y --no-install-recommends libicu66 libssl1.1 ca-certificates
              /opt/openorbis/bin/linux/PkgTool.Core pkg_extract --verbose /work/ezremote_client.pkg /work/ezremote_extract
            '
          DAEMON_SRC=$(find ezremote_extract -type f -name daemon.elf -print -quit)
          test -n "$DAEMON_SRC"
          cp "$DAEMON_SRC" daemon.elf
          test -s daemon.elf
          sha256sum daemon.elf
          sudo rm -rf ezremote_extract ezremote_client.pkg

      - name: Compile eboot
        run: |
          set -euxo pipefail
          chmod +x "$OO_PS4_TOOLCHAIN/bin/linux/"* || true
          make CC=clang-18 CXX=clang++-18 LD=ld.lld-18 eboot.bin
          test -s eboot.bin

      - name: Package PKG
        run: |
          set -euxo pipefail
          chmod -R a+rwX build sce_sys sce_module 2>/dev/null || true
          chmod a+rw daemon.elf 2>/dev/null || true
          chmod a+rw eboot.bin Makefile 2>/dev/null || true
          docker run --rm --user 0:0 \
            --env OO_PS4_TOOLCHAIN=/opt/openorbis \
            --volume "$GITHUB_WORKSPACE:/work" \
            --volume "$OO_PS4_TOOLCHAIN:/opt/openorbis" \
            --workdir /work ubuntu:20.04 bash -lc '
              export DEBIAN_FRONTEND=noninteractive
              apt-get update -qq
              apt-get install -y --no-install-recommends make libicu66 libssl1.1 ca-certificates python3
              make IV0000-PBDL00001_00-PS4BROWSERDL0001.pkg
            '
          cp IV0000-PBDL00001_00-PS4BROWSERDL0001.pkg PS4_Hybrid_Browser_v7_6_GPU.pkg
          sha256sum PS4_Hybrid_Browser_v7_6_GPU.pkg > PS4_Hybrid_Browser_v7_6_GPU.pkg.sha256

      - name: Validate hybrid backend
        run: |
          set -euxo pipefail
          node --check backend/server.js
          python3 -m json.tool backend/package.json >/dev/null
          grep -q 'app.get("/api/pending-download"' backend/server.js
          grep -q 'app.get("/api/focus-info"' backend/server.js
          grep -q 'app.post("/api/type-submit"' backend/server.js
          grep -q 'app.get("/shot-fast"' backend/server.js
          grep -q 'Page.startScreencast' backend/server.js
          grep -q 'app.post("/api/home"' backend/server.js

      - name: Package hybrid backend
        run: |
          set -euxo pipefail
          python3 -m zipfile -c PS4_Hybrid_Browser_Backend_v7_6.zip backend
          test -s PS4_Hybrid_Browser_Backend_v7_6.zip

      - name: Upload PKG
        uses: actions/upload-artifact@v4
        with:
          name: PS4-Hybrid-Browser-v7-6-GPU
          retention-days: 14
          if-no-files-found: error
          path: |
            PS4_Hybrid_Browser_v7_6_GPU.pkg
            PS4_Hybrid_Browser_v7_6_GPU.pkg.sha256
            PS4_Hybrid_Browser_Backend_v7_6.zip
