name: Build Independent NetSurf PS4

on:
  push:
    branches: [ independent-engine-poc ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends             clang-18 lld-18 llvm-18 make curl tar pkg-config             python3 perl bison flex gperf libpng-dev ca-certificates file
          sudo ln -sf /usr/bin/clang-18 /usr/local/bin/clang-18
          sudo ln -sf /usr/bin/clang++-18 /usr/local/bin/clang++-18
          sudo ln -sf /usr/bin/llvm-ar-18 /usr/local/bin/llvm-ar-18

      - name: Download OpenOrbis v0.5.4
        run: |
          set -euxo pipefail
          curl -fL --retry 5 --retry-all-errors             https://github.com/OpenOrbis/OpenOrbis-PS4-Toolchain/releases/download/v0.5.4/toolchain-llvm-18.tar.gz             -o toolchain.tar.gz
          echo '3c7cd5bb593ca74fa1c13fd59f3938dc0fc07985167f7275063019e63abe4526  toolchain.tar.gz' | sha256sum -c -
          mkdir -p .openorbis
          tar xzf toolchain.tar.gz -C .openorbis
          LINK_X=$(find "$GITHUB_WORKSPACE/.openorbis" -type f -name link.x -print -quit)
          test -n "$LINK_X"
          echo "OO_PS4_TOOLCHAIN=$(dirname "$LINK_X")" >> "$GITHUB_ENV"

      - name: Build NetSurf for PS4
        run: |
          chmod +x scripts/build_netsurf_ps4.sh
          scripts/build_netsurf_ps4.sh

      - name: Package independent PS4 PKG
        run: |
          set -euxo pipefail
          chmod +x scripts/package_netsurf_ps4.sh
          chmod -R a+rwX "$GITHUB_WORKSPACE"
          docker run --rm --user 0:0 \
            --env OO_PS4_TOOLCHAIN=/opt/openorbis \
            --volume "$GITHUB_WORKSPACE:/work" \
            --volume "$OO_PS4_TOOLCHAIN:/opt/openorbis" \
            --workdir /work ubuntu:20.04 bash -lc '
              export DEBIAN_FRONTEND=noninteractive
              apt-get update -qq
              apt-get install -y --no-install-recommends libicu66 libssl1.1 ca-certificates python3 findutils
              chmod +x /opt/openorbis/bin/linux/* || true
              scripts/package_netsurf_ps4.sh
            '
          test -s PS4_Browser_NetSurf_Network_v1.5.pkg
          sha256sum -c PS4_Browser_NetSurf_Network_v1.5.pkg.sha256

      - name: Upload independent PKG
        uses: actions/upload-artifact@v4
        with:
          name: PS4-Browser-NetSurf-PoC
          retention-days: 30
          if-no-files-found: error
          path: |
            PS4_Browser_NetSurf_Network_v1.5.pkg
            PS4_Browser_NetSurf_Network_v1.5.pkg.sha256

      - name: Upload cross-build
        uses: actions/upload-artifact@v4
        with:
          name: netsurf-ps4-cross-build
          path: build/independent/
          if-no-files-found: error
